name: 상어 레이더 외부 설계공모 수집
on:
  push:
    branches: [main]
    paths: ['scripts/fetch_competitions.py', '.github/workflows/competitions.yml']
  schedule:
    - cron: '40 3,10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: external-competitions
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_competitions.py
      - run: node scripts/test_workload.cjs
      - run: python scripts/fetch_competitions.py
      - name: Save collection
        run: |
          git add data/competitions.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh external architecture competitions'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
