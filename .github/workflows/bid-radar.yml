name: 건축감리 입찰 자동수집 및 배포
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bid-radar.yml"
  schedule:
    # UTC 03:30 / 10:30 = KST 12:30 / 19:30
    - cron: "30 3,10 * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "텔레그램 연결 테스트만 보내기 (공고 수집 없음)"
        type: boolean
        default: false
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bid-radar-collection
  cancel-in-progress: false

jobs:
  update-bids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Telegram test message
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_telegram == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/test_telegram.py
      - name: Fetch G2B notices
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_telegram != true }}
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/fetch_bids.py
      - name: Fetch G2B award results
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_telegram != true }}
        continue-on-error: true
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          G2B_AWARD_API_KEY: ${{ secrets.G2B_AWARD_API_KEY }}
        run: python scripts/fetch_awards.py
      - name: Commit updated data and notification receipts
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_telegram != true }}
        run: |
          if git diff --quiet -- data/bids.json data/awards.json data/alert_state.json; then
            echo "No new data."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/bids.json data/awards.json data/alert_state.json
            git commit -m "chore: refresh architecture bid notices"
            git push
          fi
      # pages.yml automatically deploys data updates committed to main.
